[package]
name = "your-flare-mails-desktop"
version = "0.0.1"
description = "YourFlareMails desktop shell"
authors = ["YourFlareMails"]
edition = "2021"

[lib]
name = "your_flare_mails_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-mobile-push = { path = "../vendor/tauri-plugin-mobile-push" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
